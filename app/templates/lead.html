<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀장 화면 - 팀플 관리 에이전트</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 32px auto; padding: 0 16px; line-height: 1.6; color: #222; }
    .sub { color: #555; margin-top: 0; }
    .badge { font-size: 13px; font-weight: normal; background: #fff3cd; color: #7a5800; padding: 2px 8px; border-radius: 10px; vertical-align: middle; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .s-통과 { color: #1e7d32; font-weight: bold; }
    .s-보완 { color: #b00020; font-weight: bold; }
    .s-팀장 { color: #a06a00; font-weight: bold; }
    .check { border: 1px solid #e0b34a; background: #fffaf0; border-radius: 8px; padding: 12px; margin-top: 12px; }
    .check h3 { margin: 0 0 4px; font-size: 16px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-family: inherit; max-height: 240px; overflow: auto; }
    ul.items li.bad { color: #b00020; }
    ul.items li.ok { color: #1e7d32; }
    input { font: inherit; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #888; background: #f4f4f4; cursor: pointer; margin: 6px 6px 0 0; }
    button.pass { background: #1e7d32; border-color: #1e7d32; color: #fff; }
    button.fix { background: #b00020; border-color: #b00020; color: #fff; }
    #error { color: #b00020; }
    .bar { display: inline-block; width: 70px; height: 10px; background: #e6e6e6; border-radius: 5px; overflow: hidden; vertical-align: middle; }
    .bar .fill { height: 100%; background: #2457d6; }
    .bar-label { margin-left: 6px; font-size: 13px; }
    tr.sum td { font-weight: bold; background: #fafafa; }
    td.warn { color: #b00020; font-weight: bold; }
    .board-note { font-size: 13px; color: #666; }
    .clock { border: 1px dashed #2457d6; border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: #f7f9ff; }
    .clock-note { font-size: 13px; color: #666; margin-top: 4px; }
    .late-tag { color: #b00020; font-weight: bold; }
    details.mail { border-bottom: 1px solid #eee; padding: 6px 0; font-size: 14px; }
    details.mail summary { cursor: pointer; }
    details.mail .fail { color: #b00020; font-weight: bold; }
    details.mail .kind { display: inline-block; min-width: 64px; font-weight: bold; }
  </style>
  <script src="/board.js"></script>
</head>
<body>
  <h1>팀장 화면 <span id="store-badge" class="badge" hidden>연습용 저장</span></h1>
  <p class="sub" id="sub"></p>
  <div id="error"></div>

  <div class="clock">
    <strong>시연용 날짜</strong> <span id="clock-today"></span>
    <span id="clock-offset" class="badge" hidden></span>
    <div>
      <button type="button" data-days="1">하루 넘기기</button>
      <button type="button" data-days="7">일주일 넘기기</button>
      <button type="button" id="clock-reset">오늘로 돌아가기</button>
      <button type="button" id="daily-now">오늘 알림 보내기</button>
    </div>
    <div class="clock-note">2–4주 과정을 짧게 보여 주기 위한 기능입니다. 이 팀의 날짜만 바뀝니다(최대 60일). 날짜를 넘기면 넘긴 날마다 매일 알림이 나갑니다.</div>
    <div class="clock-note" id="clock-msg"></div>
  </div>

  <h2>확인할 것</h2>
  <div id="checks"></div>

  <h2>기여도 판 <span id="share-note" class="badge"></span></h2>
  <div id="board"></div>

  <h2>전체 할 일</h2>
  <table>
    <thead><tr><th>#</th><th>할 일</th><th>담당</th><th>마감</th><th>상태</th><th>보완 횟수</th><th>알림 횟수</th></tr></thead>
    <tbody id="all"></tbody>
  </table>

  <h2>보낸 메일 <span id="mail-badge" class="badge" hidden>연습용: 실제로 안 보냄</span></h2>
  <div id="outbox"></div>

  <script>
    const token = new URLSearchParams(location.search).get("t");

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function checkCard(g) {
      const card = el("div", "check");
      card.append(el("h3", "", `${g.title} · ${g.owner}`));
      card.append(el("div", "", `완료 기준: ${g.done_rule}`));
      const last = g.last;
      card.append(el("div", "", `AI 검수${last.fake ? "(연습용 가짜)" : ""}: ${last.result} · 제출 ${last.at}`));
      const ul = el("ul", "items");
      last.items.forEach(i => {
        const mark = i.ok === true ? "채움" : i.ok === false ? "못 채움" : "판단 어려움";
        ul.append(el("li", i.ok === true ? "ok" : i.ok === false ? "bad" : "", `${i.rule} — ${mark} (${i.why})`));
      });
      card.append(ul);
      card.append(el("div", "", "제출 내용"), el("pre", "", last.content));
      const note = el("input");
      note.placeholder = "보완 요청에 덧붙일 말(선택, 판단 어려움만 있으면 꼭 적기)";
      note.maxLength = 500;
      const out = el("div");
      const fix = el("button", "fix", "보완 요청 보내기");
      const pass = el("button", "pass", "통과로 하기");
      async function decide(decision) {
        fix.disabled = pass.disabled = true;
        try {
          const res = await fetch("/api/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lead: token, goal_id: g.id, decision, note: note.value }),
          });
          const body = await res.json();
          if (!res.ok) { out.replaceChildren(el("div", "", typeof body.detail === "string" ? body.detail : "처리하지 못했습니다.")); fix.disabled = pass.disabled = false; return; }
          load();
        } catch {
          out.replaceChildren(el("div", "", "서버에 연결하지 못했습니다."));
          fix.disabled = pass.disabled = false;
        }
      }
      fix.addEventListener("click", () => decide("보완 요청"));
      pass.addEventListener("click", () => decide("통과"));
      card.append(note, fix, pass, out);
      return card;
    }

    function showClock(c) {
      document.getElementById("clock-today").textContent = c.today;
      const off = document.getElementById("clock-offset");
      off.hidden = !c.day_offset;
      off.textContent = `진짜 오늘 +${c.day_offset}일`;
    }

    async function moveClock(payload) {
      const buttons = document.querySelectorAll(".clock button");
      buttons.forEach(b => b.disabled = true);
      try {
        const res = await fetch(payload ? "/api/clock" : "/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lead: token, ...(payload || {}) }),
        });
        const body = await res.json();
        if (!res.ok) { document.getElementById("error").textContent = typeof body.detail === "string" ? body.detail : "처리하지 못했습니다."; return; }
        document.getElementById("clock-msg").textContent =
          body.mails === undefined ? "" : body.mails ? `알림 메일 ${body.mails}통을 만들었습니다(아래 '보낸 메일').` : "새로 보낼 알림이 없습니다(그날 이미 보냈거나 내일까지 할 일이 없음).";
        await load();
      } catch {
        document.getElementById("error").textContent = "서버에 연결하지 못했습니다.";
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }

    document.querySelectorAll(".clock button[data-days]").forEach(b =>
      b.addEventListener("click", () => moveClock({ days: Number(b.dataset.days) })));
    document.getElementById("clock-reset").addEventListener("click", () => moveClock({ reset: true }));
    document.getElementById("daily-now").addEventListener("click", () => moveClock(null));

    function showOutbox(body) {
      document.getElementById("mail-badge").hidden = !body.fake_mail;
      const box = document.getElementById("outbox");
      box.replaceChildren();
      if (!body.outbox.length) { box.append(el("p", "sub", "아직 보낸 메일이 없습니다.")); return; }
      body.outbox.forEach(m => {
        const d = el("details", "mail");
        const s = el("summary");
        s.append(el("span", "kind", m.kind), document.createTextNode(` ${m.day} · ${m.to} · ${m.subject} `));
        if (m.mode === "SMTP") s.append(el("span", m.sent ? "" : "fail", m.sent ? "(보냄)" : `(실패: ${m.error})`));
        d.append(s, el("div", "sub", `받는 곳: ${m.email}`), el("pre", "", m.body));
        box.append(d);
      });
    }

    async function load() {
      const err = document.getElementById("error");
      if (!token) { err.textContent = "팀장 링크가 아닙니다."; return; }
      try {
        const res = await fetch("/api/review?lead=" + encodeURIComponent(token));
        const body = await res.json();
        if (!res.ok) { err.textContent = typeof body.detail === "string" ? body.detail : "열지 못했습니다."; return; }
        document.getElementById("store-badge").hidden = !body.fake_store;
        showClock(body);
        const passed = body.goals.filter(g => g.status === "통과").length;
        document.getElementById("sub").textContent = `팀원 ${body.members.length}명 · 할 일 ${body.goals.length}개 중 ${passed}개 통과 · 최종 마감 ${body.deadline}`;
        const checks = document.getElementById("checks");
        checks.replaceChildren();
        const waiting = body.goals.filter(g => g.status === "팀장 확인 중");
        waiting.forEach(g => checks.append(checkCard(g)));
        if (!waiting.length) checks.append(el("p", "sub", "지금 확인할 제출물이 없습니다."));
        const st = await fetch("/api/status?t=" + encodeURIComponent(token));
        const board = await st.json();
        if (st.ok) {
          renderBoard(document.getElementById("board"), board);
          document.getElementById("share-note").textContent = board.share_board ? "팀원도 봄" : "팀장만 봄";
        }
        const all = document.getElementById("all");
        all.replaceChildren();
        body.goals.forEach(g => {
          const tr = el("tr");
          [g.id, g.title, g.owner, g.due].forEach(t => tr.append(el("td", "", t)));
          const stTd = el("td", "s-" + g.status.split(" ")[0], g.status);
          if (g.overdue) stTd.append(el("span", "late-tag", " · 마감 지남"));
          tr.append(stTd);
          tr.append(el("td", "", g.fix_count));
          const rem = el("td", "", g.reminders);
          if (g.no_reply) rem.append(el("span", "late-tag", " · 응답 없음"));
          tr.append(rem);
          all.append(tr);
        });
        showOutbox(body);
      } catch {
        err.textContent = "서버에 연결하지 못했습니다.";
      }
    }
    load();
  </script>
</body>
</html>
