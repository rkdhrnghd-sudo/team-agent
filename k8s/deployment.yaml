apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  labels:
    app: hackathon-app
spec:
  replicas: 2
  revisionHistoryLimit: 5 # 되돌리기용으로 이전 버전 5개를 남긴다
  selector:
    matchLabels:
      app: hackathon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # 업데이트 중에도 준비된 앱이 2개 아래로 내려가지 않는다
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
        - name: app
          image: hackathon-app:local # 자동 배포 때 ECR 이미지 주소로 바뀐다
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: hackathon-secret # API 키. 명령으로만 만들고 파일로 올리지 않는다
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
